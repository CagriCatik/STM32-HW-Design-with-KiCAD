name: Deploy documentation (Zensical) to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Zensical
        run: pip install -r requirements.txt

      - name: Build site
        working-directory: ./webpage
        run: zensical build --clean --strict

      # Publishes webpage/site to the gh-pages branch, the same Pages source the MkDocs workflow used
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.MKDOCS_DEPLOY_TOKEN }}
          publish_dir: ./webpage/site
          force_orphan: true

  cleanup:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      deployments: write
      contents: read

    steps:
      - name: Delete old GitHub Pages deployments
        uses: strumwolf/delete-deployment-environment@v2
        with:
          token: ${{ secrets.MKDOCS_DEPLOY_TOKEN }}
          environment: github-pages
          onlyRemoveDeployments: true
